<div id="cityModal" class="modal-overlay" style="display:none;">
    <div class="modal">
        <h2>Выберите город</h2>
        <select id="citySelect">
            <option>Москва</option>
            <option>Санкт-Петербург</option>
            <option>Новосибирск</option>
            <option>Екатеринбург</option>
            <option>Казань</option>
        </select>
        <button type="button" onclick="CityManager.confirmCity()">Подтвердить</button>
        <button type="button" id="city-cancel" onclick="CityManager.closeModal()">Отмена</button>
    </div>
</div>
